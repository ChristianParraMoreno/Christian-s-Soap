  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - I sell soap</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 60px 20px;">
  <h1>Checkout</h1>
  <p>1x Soap Bar — Total: $6.00</p>
  <button
    id="buyBtn"
    onclick="completeOrder()"
    style="padding: 12px 24px; font-size: 16px; cursor: pointer;"
  >
    Complete Order
  </button>
  <p id="statusMsg" style="margin-top: 20px; font-weight: bold; color: green;"></p>

  <script>
    function completeOrder() {
      if (typeof gtag === 'function') {
        gtag('event', 'purchase', {
          transaction_id: 'SOAP-' + Date.now(),
          value: 10.0,
          currency: 'USD'
        });
      }
      document.getElementById('statusMsg').textContent = 'Order Confirmed! Thank you for buying soap.';
    }
  </script>
</body>
</html>
