  <style>
    :root {
      --bg-cream: #faf7f2;
      --bg-sand: #f1ebe1;
      --bg-card: #ffffff;
      --forest: #24382f;
      --forest-light: #385447;
      --sage: #dce5de;
      --terracotta: #c47451;
      --terracotta-dark: #a85d3c;
      --gold: #d4a359;
      --text-main: #222624;
      --text-muted: #5c6460;
      --border: #e4ddd3;
      --shadow-sm: 0 4px 16px rgba(36, 56, 47, 0.06);
      --shadow-md: 0 12px 32px rgba(36, 56, 47, 0.1);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, .serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      line-height: 1.15;
    }

    .announcement-bar {
      background-color: var(--forest);
      color: var(--bg-cream);
      text-align: center;
      padding: 10px 16px;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
    }

    .announcement-bar strong {
      color: #f3d29c;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 247, 242, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--forest);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      color: var(--terracotta);
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 500;
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--terracotta);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-btn {
      position: relative;
      background: var(--forest);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .cart-btn:hover {
      background: var(--forest-light);
      transform: translateY(-1px);
    }

    .cart-count {
      background: var(--terracotta);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 999px;
      min-width: 22px;
      text-align: center;
    }

    .hero {
      max-width: 1240px;
      margin: 0 auto;
      padding: 64px 24px 80px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 56px;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--sage);
      color: var(--forest);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(2.75rem, 5vw, 4.25rem);
      color: var(--forest);
      margin-bottom: 20px;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--terracotta);
      font-weight: 500;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 520px;
      margin-bottom: 32px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 40px;
    }
